version: '3.8'

services:
  book-of-secret-knowledge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-of-secret-knowledge
    ports:
      - "3000:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app.name=book-of-secret-knowledge"
      - "app.description=A collection of inspiring lists, manuals, cheatsheets, and more"
    networks:
      - knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

networks:
  knowledge-network:
    driver: bridge
