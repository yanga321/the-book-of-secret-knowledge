<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Book of Secret Knowledge</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A collection of inspiring lists, manuals, cheatsheets, blogs, hacks, one-liners, cli/web tools, and more.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="static/img/the-book-of-secret-knowledge-preview.png">

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    :root {
      --theme-color: #42b983;
      --theme-color-dark: #1a1a2e;
    }

    body {
      background-color: #1a1a2e;
    }

    .sidebar {
      background-color: #16213e;
    }

    .sidebar-nav {
      padding-top: 20px;
    }

    .app-name-link {
      font-weight: bold;
      color: #42b983 !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: #42b983;
    }

    .markdown-section a {
      color: #64b5f6;
    }

    .markdown-section a:hover {
      color: #42b983;
    }

    .cover-main {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }

    .cover-main h1 {
      color: #42b983;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a2e;
    }

    ::-webkit-scrollbar-thumb {
      background: #42b983;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3aa876;
    }

    /* Search plugin styling */
    .search {
      background-color: #16213e !important;
    }

    .search input {
      background-color: #1a1a2e !important;
      color: #ffffff !important;
      border: 1px solid #42b983 !important;
    }

    .matching-post {
      background-color: #16213e !important;
      border-bottom: 1px solid #1a1a2e !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'The Book of Secret Knowledge',
      repo: 'https://github.com/trimstray/the-book-of-secret-knowledge',
      loadSidebar: false,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',

      // Search plugin configuration
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No Results!',
        depth: 3,
        hideOtherSidebarContent: false
      },

      // Copy to clipboard
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },

      // Pagination
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },

      // Theme toggle
      themeColor: '#42b983',

      // Progress bar
      progress: {
        position: "top",
        color: "#42b983",
        height: "3px"
      },

      // Tabs plugin
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-progress@latest/dist/progress.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-nginx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-ruby.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-perl.min.js"></script>

  <!-- Emoji plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
</body>
</html>
